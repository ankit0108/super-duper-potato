[project]
name = "pbs"
version = "0.2.0"
description = "Personal Brand System: scouts topics, drafts LinkedIn and X posts, learns from edits and results."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0.11",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pbs = "pbs.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pbs*"]

[tool.setuptools.package-data]
pbs = ["prompts/*.md", "defaults/*.yaml", "defaults/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108"]
