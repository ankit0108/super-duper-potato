# Phrases the drafter must avoid from day one. The learner adds phrases Ankit repeatedly cuts.
# Published posts shown to the drafter as the voice to match: the ones with the fewest AI tells and the most
# words written by hand, of the last 20.
examples_per_prompt: 3
avoid_phrases:
  - delve
  - game-changer
  - game changer
  - in today's fast-paced world
  - in today's rapidly evolving
  - unlock the power
  - unleash
  - revolutionize
  - revolutionise
  - supercharge
  - let that sink in
  - here's the thing
  - buckle up
  - the future is here
  - paradigm shift
  - synergy
  - seamlessly
  - cutting-edge
  - navigate the complexities
  - it's not just about
  - a testament to
  - rapidly evolving landscape
  - ever-evolving
  - tapestry
  - realm of
  - harness the power
  - "🚀"
bait_phrases:
  - agree?
  - thoughts?
  - comment below
  - like if
  - rt if
  - repost if
  - tag someone
  - follow for more
  - drop a
  - who else
  - smash that
