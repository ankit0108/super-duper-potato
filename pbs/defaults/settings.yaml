# PBS default settings. Ankit's overrides (made in the desk) are stored in the private data repo
# and deep-merged over this file. Nothing personal belongs here: this repo can be public.

timezone: Australia/Melbourne
display_name: Ankit

delivery:
  # The morning set is delivered by the first run on or after this local time each day. GitHub can start
  # scheduled runs hours late, so the schedule starts early (see .github/workflows/pbs.yml) to land by 6am.
  earliest_local_time: "01:00"
  # After this local time a missed morning delivery is skipped (tomorrow's comes instead).
  latest_local_time: "21:00"
  # Saturday batch (evergreen + interview cards for the week).
  weekly_batch_day: saturday
  weekly_batch_local_time: "19:00"
  # Weekly reflection fallback if Ankit hasn't run it from the desk by then.
  reflection_fallback_day: monday
  reflection_fallback_local_time: "05:00"

platforms:
  linkedin:
    enabled: true
    slots: 5
    min_slots: 3
    max_interview_per_day: 1
    char_limit: 3000
    fold_chars: 210
  x:
    enabled: true
    slots: 10
    min_slots: 6
    max_interview_per_day: 1
    premium: false
    char_limit: 280
    premium_char_limit: 25000
    thread_min: 3
    thread_max: 7
    reply_slots: 2
    reply_until_followers: 500

formats:
  li_text: {label: Text post, platform: linkedin, prior: 0.5}
  x_single: {label: Single post, platform: x, prior: 0.5}
  x_thread: {label: Thread, platform: x, prior: 0.45}
  x_quote: {label: Quote-post angle, platform: x, prior: 0.4}
  x_reply: {label: Reply angle, platform: x, prior: 0.5}

strategy:
  linkedin:
    receipts:
      label: Firsthand receipts
      weight: 0.25
      mode: interview
      formats: [li_text]
      scouts: [tech]
      description: >-
        What building automation in enterprise and financial services actually teaches, with identifying
        details removed. Drafted only from Ankit's answers.
      keywords: [automation, rpa, workflow, process, enterprise, bank, banking, financial services, insurance,
        compliance, operations, legacy, mainframe, document processing, intelligent document, invoice, kyc,
        onboarding, reconciliation, bots, citizen developer, center of excellence, uipath, automation anywhere,
        power automate, blue prism, process mining, orchestration, adoption, roi, governance, production]
    research:
      label: Research and state of the art
      weight: 0.20
      mode: external
      formats: [li_text]
      scouts: [tech]
      description: >-
        New papers, benchmarks, model and agent capabilities, and techniques moving from labs into practice,
        explained plainly: what's new, why it matters and for whom.
      keywords: [paper, arxiv, research, researchers, benchmark, study, dataset, evaluation, evals, reasoning,
        architecture, training, fine-tuning, rlhf, alignment, interpretability, scaling, inference, state of the art,
        technique, method, open-weights, reinforcement learning, tool use, long context, multimodal, distillation,
        hugging face, preprint, lab]
    industry:
      label: Industry news, with a take
      weight: 0.20
      mode: external
      formats: [li_text]
      scouts: [tech, startups]
      description: >-
        The whole AI and automation industry: labs and model releases, AI startups and funding, big-tech moves,
        enterprise adoption, regulation, compute and infrastructure, and automation vendors (Automation Anywhere,
        UiPath, Power Automate). Each gets an analytical take that fits the story itself (the technology, the
        business, the market, the people using it, or the policy), not always enterprise or process automation.
      keywords: [launch, launches, released, release, announces, raises, funding, valuation, acquisition, acquires,
        partnership, earnings, revenue, layoffs, regulation, policy, ai act, lawsuit, antitrust, compute, gpu, nvidia,
        data center, datacenter, chips, openai, anthropic, google, deepmind, microsoft, meta, amazon, aws, apple, xai,
        mistral, deepseek, pricing, uipath, automation anywhere, power automate, copilot, agentforce, salesforce,
        servicenow, digital public infrastructure, indiaai]
    learning:
      label: Learning in public
      weight: 0.15
      mode: interview
      formats: [li_text]
      scouts: [tech]
      description: >-
        Builds and experiments, including the FDE-track work: evals, agents, MCP. Drafted only from Ankit's answers.
      keywords: [agents, agent, agentic, mcp, model context protocol, evals, tool calling, function calling, sdk,
        framework, langgraph, langchain, llamaindex, open source, tutorial, prototype, rag, retrieval, prompt,
        prompting, forward deployed, coding agent, claude code, cursor, workflow builder]
    humor:
      label: Tech humour
      weight: 0.20
      mode: external
      # At least one funny post every morning.
      min_per_day: 1
      formats: [li_text]
      scouts: [humor]
      description: >-
        Funny, work-safe posts about tech and work: a light take on today's tech, AI or startup news (the facts from
        the sources, the joke in the framing), or a relatable observation about building software, AI hype, demos,
        meetings, naming things and LinkedIn itself. Never mean, never about customers, colleagues or employers.
      post_types: {funny_take: Funny take, observation: Relatable}
      keywords: [joke, funny, meme, hype, buzzword, demo, standup, meeting, deadline, jira, bug, debugging, chatbot,
        hallucination, prompt engineering, rebrand, rename, pivot, slide deck, roadmap, sprint, legacy code, outage,
        captcha, keynote]
  x:
    tech:
      label: Tech and AI
      weight: 0.25
      mode: external
      formats: [x_single, x_thread, x_quote, x_reply]
      scouts: [tech]
      description: Faster, lighter takes than LinkedIn; threads welcome.
      keywords: [ai, llm, model, openai, anthropic, google, gpt, claude, gemini, llama, agent, software, developer,
        programming, chip, apple, robotics, open source, benchmark, release, launch]
    affairs:
      label: World, India and Bihar affairs
      weight: 0.20
      mode: external
      formats: [x_single, x_thread, x_quote, x_reply]
      scouts: [affairs]
      description: >-
        History behind the news, development trackers, future outlooks, opinions from recorded stances, and stories
        from Bihar's past and present that aren't tied to this week's news (eras, people, places, achievements,
        traditions, the economy).
      keywords: [election, government, minister, policy, parliament, court, economy, gdp, inflation, budget,
        infrastructure, railway, highway, airport, bihar, patna, india, china, war, ceasefire, climate, flood, monsoon,
        census, caste, reservation, education, health, migration, history, culture, बिहार, पटना, सरकार]
    startups:
      label: Startups
      weight: 0.15
      mode: external
      formats: [x_single, x_thread, x_quote, x_reply]
      scouts: [startups, tech]
      description: Ecosystem news, founder lessons, market moves.
      keywords: [startup, startups, founder, founders, funding, raises, seed, series a, series b, ipo, valuation,
        venture, unicorn, y combinator, accelerator, acquisition, bootstrapped, arr, saas, fintech, d2c]
    life:
      label: Life
      weight: 0.10
      mode: interview
      formats: [x_single, x_thread]
      scouts: [life]
      description: Personal observations and experiences. Interview mode only.
      keywords: [festival, chhath, diwali, holi, cricket, melbourne, family, travel, food, books, habit, lesson]
    humor:
      label: Funny
      weight: 0.15
      mode: external
      formats: [x_single, x_quote]
      scouts: [humor]
      description: >-
        Funny posts about anything: a light take on today's news from any lane (the facts from the sources, the joke
        in the framing), or a relatable observation about tech, work, startups, cricket, Melbourne weather, family
        WhatsApp groups or growing up in Bihar, told with affection. The joke is never on a community or a person.
      post_types: {funny_take: Funny take, observation: Relatable}
      keywords: [joke, funny, meme, viral, hype, buzzword, rebrand, rename, keynote, demo, chatbot, hallucination,
        whatsapp, captcha, autocorrect]
    ideas:
      label: Quotes, excerpts and thoughts
      weight: 0.15
      mode: external
      formats: [x_single, x_thread]
      scouts: [ideas]
      description: >-
        Insight in a line or two: a quote from someone worth quoting (checked word for word on Wikiquote), a short
        excerpt from a paper, essay, speech or long read with what it means, or one sharp thought of his own on work,
        learning, building or Bihar.
      post_types: {quote: Quote, excerpt: Excerpt, thought: Thought}
      keywords: [essay, speech, lecture, letter, interview, memoir, book, philosophy, principle, lesson, wisdom,
        commencement, obituary, profile]

affairs:
  # Post types for the affairs lane. `opinion` needs a recorded stance or interview answers.
  types:
    history: History behind the news
    tracker: Development tracker
    outlook: Future outlook
    opinion: Opinion
    story: Story, history to now
  linkedin_allowed_topics: [ai regulation, digital public infrastructure, data protection, indiaai, upi, aadhaar]
  # X slots a day kept for the best evergreen story (Bihar from ancient Magadha to today: story_pools.yaml), so
  # Bihar posts aren't only this week's headlines. 0 lets stories compete with the news on their own.
  stories_per_day: 1

pools:
  # Material that isn't news, a few entries a day each, ranked next to the news: premises for a relatable funny post
  # (humor_pools.yaml: tech and work on both platforms, life on X only) and themes for a thought (thought_pools.yaml,
  # X). Quotes come from the "Wikiquote: quotes worth sharing" source. 0 turns a pool off.
  humor: 4
  thoughts: 2

hooks:
  types: [question, contrarian, number, story, how-to, observation]

watchlist:
  # Large accounts likely to post about the day's biggest announcements (used for reply angles).
  tech: [OpenAI, AnthropicAI, GoogleDeepMind, sama, karpathy, simonw, emollick, AndrewYNg, swyx, ylecun]
  startups: [ycombinator, garrytan, paulg, naval, Inc42, YourStoryCo]
  affairs: [ThePrintIndia, IndianExpress, htTweets, the_hindu, PIB_India, BBCWorld]
  life: []

scouting:
  concurrency: 8
  timeout_seconds: 20
  max_items_per_source: 40
  item_retention_days: 45
  dedup_window_days: 7
  lookback_hours: {tech: 72, affairs: 48, startups: 72, life: 168, humor: 72, ideas: 72}
  cluster_threshold: 0.32
  # Topics per platform sent to triage (in batches): enough to fill ten X slots after triage drops some.
  shortlist_per_platform: 18
  candidates_per_scout: {tech: 30, affairs: 24, startups: 12, life: 6, humor: 6, ideas: 6}
  per_source_cap: 8
  pause_after_failure_days: 7
  pause_after_zero_yield_weeks: 4
  user_agent: "PBS/0.2 (personal research digest; +https://github.com)"

ranking:
  novelty_window_days: 30
  resuggest_block_days: 3
  # A topic triaged within this many hours keeps that triage, so "Get fresh posts" only asks about new topics.
  triage_reuse_hours: 6
  diversity_arm_penalty: 0.7
  weights: {fit: 1.0, timeliness: 1.0, momentum: 0.8, novelty: 1.0}
  timeliness_half_life_hours: {tech: 30, affairs: 20, startups: 36, life: 168, research: 96, humor: 168, ideas: 168}

learning:
  frozen: false
  half_life_days: 42
  prior_strength: 4
  explore_rate: 0.2
  explore_rate_cold_start: 0.3
  cold_start_days: 14
  metrics_min_posts: 10
  median_window: 20
  perf_blend: 0.4
  expired_value: 0.2
  skip_values:
    not_interesting: 0.0
    off_brand: 0.0
    too_risky: 0.1
    wrong_timing: null
    already_covered: null
    other: 0.1
    # Moved to the other platform: the topic was fine, the platform wasn't.
    wrong_platform: 0.3
  edit_ratio_review_weeks: 4

rewards:
  # Ankit's to change; the learner never changes these.
  linkedin: {followers_gained: 0.30, profile_views: 0.25, comments: 0.25, reposts: 0.15, impressions: 0.05}
  x: {comments: 0.30, reposts: 0.25, followers_gained: 0.25, impressions: 0.10, reactions: 0.10}

hashtags:
  # Suggested with every draft and shown as chips on the card: he keeps, drops or adds his own, and the
  # selection is added at the end when he copies or opens the app. Learned from what he keeps.
  enabled: true
  linkedin: {min: 3, max: 5}
  x: {min: 0, max: 2}
  # Tags too broad to help anyone find a post.
  avoid: ["#Innovation", "#Motivation", "#Success", "#Business", "#Technology", "#Tech", "#Future", "#Trending",
          "#Viral", "#Inspiration", "#Leadership"]

visuals:
  # Carousels, flowcharts, comparisons, lists, big numbers and quote cards, written from the post and drawn by
  # the desk. AI images (below) add an illustration or a background; the words are always drawn by the desk.
  # The name on every image: empty uses display_name.
  enabled: true
  name_linkedin: ""
  name_x: ""
  accent: "#4F46E5"

images:
  # AI images for visuals: an illustration for a post, or a background for a carousel cover, big number or
  # quote card. Providers in order; each is used only when its secrets are set:
  #   cloudflare    CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_API_TOKEN: free daily allowance (about 60 images)
  #   gemini_image  GEMINI_IMAGE_API_KEY: paid per image (Google has no free image quota)
  #   xai           XAI_API_KEY: paid per image (Grok Imagine)
  enabled: true
  providers: [cloudflare, gemini_image, xai]
  daily_limit: 20

drafting:
  # Cards that ask for his experience arrive already drafted from recent sources; the questions are optional,
  # and answering redrafts the post from his answers plus the sources.
  interview_draft_now: true
  questions_per_card: 2
  # The editor pass: a draft that reads as AI-written ("It's not X, it's Y", "Here's why", em dashes, emoji
  # bullets, filler...) gets one more call that rewrites only those parts, and is kept only if it's better.
  editor_pass: true
  editor_max_per_run: 12
  editor_reserve: 12  # skipped when this few model calls are left, so drafts always come first
  # Cards drafted at the same time; each model provider still keeps its own pace (requests a minute).
  parallel: 3
  # How far back a search for sources may reach when a card has none (interview-bank and Saturday cards).
  source_search_days: 30

expiry:
  interview_days: 7
  evergreen_days: 7
  request_days: 3
  editing_idle_hours: 72

weekly_batch:
  interview_cards: {linkedin: 3, x: 3}
  evergreen_cards: {linkedin: 1, x: 2}

llm:
  # A morning set of 15 cards is about 20 calls (triage, drafts) plus up to 12 editor passes.
  daily_cap: 100
  max_calls_per_run: 60
  personal_allow_training_fallback: true
  # Free tiers change often. Gemini models are discovered at run time ("auto:"), so retired models don't
  # break anything; its free quotas are per model, so a model that runs out hands over to the next.
  # Groq (free key, doesn't train on inputs) is the main fallback; OpenRouter's free router is the last resort.
  providers:
    gemini:
      kind: gemini
      model: auto:flash
      quota_per_model: true
      api_key_env: GEMINI_API_KEY
      daily_limit: 60
      rpm: 5
      output_headroom: 4096
      trains_on_inputs: true
      vision: true
      grounding: true
    gemini_lite:
      kind: gemini
      model: auto:flash-lite
      quota_per_model: true
      api_key_env: GEMINI_API_KEY
      daily_limit: 300
      rpm: 10
      output_headroom: 2048
      trains_on_inputs: true
      vision: true
    groq:
      kind: openai
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b
      # Each model has its own per-minute token limit on the free tier: when one is busy, the next answers.
      fallback_models: [openai/gpt-oss-20b, meta-llama/llama-4-scout-17b-16e-instruct, llama-3.3-70b-versatile]
      quota_per_model: true
      api_key_env: GROQ_API_KEY
      daily_limit: 500
      rpm: 20
      max_input_tokens: 5000
      output_headroom: 1024
      extra_body: {reasoning_effort: low}
      trains_on_inputs: false
    openrouter:
      kind: openai
      base_url: https://openrouter.ai/api/v1
      model: openrouter/free
      api_key_env: OPENROUTER_API_KEY
      daily_limit: 45
      rpm: 10
      output_headroom: 1024
      trains_on_inputs: true
  routes:
    translate: [gemini_lite, groq, gemini, openrouter]
    triage: [gemini_lite, gemini, groq, openrouter]
    draft: [gemini, groq, gemini_lite, openrouter]
    draft_personal: [groq, gemini, gemini_lite, openrouter]
    edit: [groq, gemini, gemini_lite]
    questions: [gemini_lite, gemini, groq, openrouter]
    reflect: [gemini, groq, gemini_lite]
    voice: [groq, gemini, gemini_lite]
    vision: [gemini, gemini_lite]
    search: [gemini]
    search_plan: [gemini_lite, groq, gemini, openrouter]
    search_rerank: [gemini_lite, groq, gemini, openrouter]
    research: [gemini, groq, gemini_lite]
    visual: [gemini, groq, gemini_lite, openrouter]
    stances: [gemini, groq, gemini_lite]
    evergreen: [gemini, groq, gemini_lite, openrouter]
  # Seconds a call may take before that model counts as busy and the next one answers: a stalled call once cost
  # minutes. Search with grounding and the weekly review get longer.
  timeouts: {default: 90, draft: 50, draft_personal: 50, edit: 40, triage: 75, translate: 45, questions: 45,
             visual: 60, search_plan: 40, search_rerank: 40}
  temperature:
    translate: 0.1
    triage: 0.2
    draft: 0.8
    draft_personal: 0.7
    edit: 0.4
    questions: 0.6
    reflect: 0.3
    voice: 0.3
    vision: 0.0
    search: 0.2
    search_plan: 0.2
    search_rerank: 0.0
    research: 0.2
    visual: 0.5
    stances: 0.4
    evergreen: 0.6

notify:
  # Content-free pings. Configure PBS_NTFY_TOPIC or PBS_TELEGRAM_BOT_TOKEN + PBS_TELEGRAM_CHAT_ID as secrets.
  on_delivery: true
  on_request_done: true
  on_failure: true
  desk_url: ""
