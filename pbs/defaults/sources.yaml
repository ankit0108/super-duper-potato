# Seed source registry. Merged into the data repo's `sources` table on every run: new seeds are added,
# Ankit's edits and the health history are kept. Failing sources pause themselves after a week and show
# up on the desk; any of them can be replaced by a Google News query from the Sources page.
#
# kinds: rss (RSS/Atom URL), gnews (Google News query or topic), arxiv (API query), hf_papers,
#        hn_front (Hacker News front page via Algolia), hn_show (Show HN), wikipedia_otd, reddit (best effort)
# Some outlets refuse GitHub's servers or retire their feeds; a "site:" Google News query for the same outlet
# is the dependable replacement (it is how the sources that failed on the first live runs are fetched now).

tech:
  - {id: hf-daily-papers, name: Hugging Face daily papers, kind: hf_papers, url: "https://huggingface.co/api/daily_papers", pillar_hints: [research]}
  - id: arxiv-agents-evals
    name: arXiv (agents, evals, tool use)
    kind: arxiv
    query: '(cat:cs.AI OR cat:cs.CL OR cat:cs.MA OR cat:cs.SE) AND (abs:agent OR abs:agents OR abs:"tool use" OR abs:benchmark OR abs:evaluation OR abs:automation)'
    max_items: 30
    pillar_hints: [research, learning]
  - {id: hn-front, name: Hacker News front page, kind: hn_front, url: "https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=60", pillar_hints: [industry, learning]}
  - {id: openai-news, name: OpenAI news, kind: rss, url: "https://openai.com/news/rss.xml", pillar_hints: [industry, research]}
  - {id: deepmind-blog, name: Google DeepMind blog, kind: rss, url: "https://deepmind.google/blog/rss.xml", pillar_hints: [research, industry]}
  - {id: google-ai-blog, name: Google AI blog, kind: rss, url: "https://blog.google/technology/ai/rss/", pillar_hints: [industry]}
  - {id: microsoft-ai-blog, name: "Google News: Microsoft on AI", kind: gnews, query: 'site:blogs.microsoft.com OR site:news.microsoft.com AI when:7d', pillar_hints: [industry]}
  - {id: huggingface-blog, name: Hugging Face blog, kind: rss, url: "https://huggingface.co/blog/feed.xml", pillar_hints: [learning, research]}
  - {id: aws-ml-blog, name: AWS machine learning blog, kind: rss, url: "https://aws.amazon.com/blogs/machine-learning/feed/", pillar_hints: [learning]}
  - {id: simon-willison, name: Simon Willison, kind: rss, url: "https://simonwillison.net/atom/everything/", pillar_hints: [learning, research]}
  - {id: import-ai, name: Import AI, kind: rss, url: "https://jack-clark.net/feed/", pillar_hints: [research]}
  - {id: latent-space, name: Latent Space, kind: rss, url: "https://www.latent.space/feed", pillar_hints: [learning, industry]}
  - {id: interconnects, name: Interconnects, kind: rss, url: "https://www.interconnects.ai/feed", pillar_hints: [research]}
  - {id: techcrunch-ai, name: TechCrunch AI, kind: rss, url: "https://techcrunch.com/category/artificial-intelligence/feed/", pillar_hints: [industry]}
  - {id: verge-ai, name: The Verge AI, kind: rss, url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", pillar_hints: [industry]}
  - {id: venturebeat-ai, name: "Google News: VentureBeat AI", kind: gnews, query: 'site:venturebeat.com AI when:2d', pillar_hints: [industry]}
  - {id: mit-tech-review, name: MIT Technology Review, kind: rss, url: "https://www.technologyreview.com/feed/", pillar_hints: [research, industry]}
  - {id: mcp-python-sdk, name: MCP Python SDK releases, kind: rss, url: "https://github.com/modelcontextprotocol/python-sdk/releases.atom", pillar_hints: [learning]}
  - {id: gnews-anthropic, name: "Google News: Anthropic", kind: gnews, query: "Anthropic Claude when:2d", pillar_hints: [industry]}
  - {id: gnews-rpa-vendors, name: "Google News: automation vendors", kind: gnews, query: 'UiPath OR "Automation Anywhere" OR "Power Automate" OR "Copilot Studio" when:3d', pillar_hints: [industry, receipts]}
  - {id: gnews-agentic-enterprise, name: "Google News: agentic AI in enterprise", kind: gnews, query: '"agentic AI" enterprise when:2d', pillar_hints: [industry, receipts]}
  - {id: gnews-ai-banking, name: "Google News: AI in banking and finance", kind: gnews, query: 'AI automation bank OR banking OR insurance when:3d', pillar_hints: [receipts, industry]}
  - {id: gnews-ai-regulation, name: "Google News: AI regulation", kind: gnews, query: '"AI regulation" OR "AI Act" OR "AI policy" when:2d', pillar_hints: [industry]}
  - {id: gnews-mcp, name: "Google News: Model Context Protocol", kind: gnews, query: '"Model Context Protocol" OR "MCP server" when:7d', pillar_hints: [learning]}
  - {id: gnews-indiaai, name: "Google News: IndiaAI and DPI", kind: gnews, query: 'IndiaAI OR "digital public infrastructure" OR MeitY AI when:3d', hl: en-IN, gl: IN, ceid: "IN:en", pillar_hints: [industry]}
  - {id: reddit-localllama, name: r/LocalLLaMA, kind: reddit, url: "https://www.reddit.com/r/LocalLLaMA/top/.rss?t=day", best_effort: true, pillar_hints: [learning, research]}
  - {id: reddit-machinelearning, name: r/MachineLearning, kind: reddit, url: "https://www.reddit.com/r/MachineLearning/top/.rss?t=day", best_effort: true, pillar_hints: [research]}

