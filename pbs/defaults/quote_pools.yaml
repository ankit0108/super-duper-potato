# Quotes for X (pbs/pools.py, the "Quotes, excerpts and thoughts" lane). A few a day are checked against the
# author's English Wikiquote page: a quote is used only when its words are on that page, in order, outside the
# misattributed, disputed, attributed and "quotes about" sections. One that isn't found is skipped and counted in
# the run log ("quotes: N verified, M not found on Wikiquote"), so a misattributed quote never reaches a card.
#
# Each entry: `by` (the author, as the post names them), `text` (at most 180 characters) and, when the Wikiquote
# page has another title, `page`. Translations are checked like anything else: use the translation the page has.

