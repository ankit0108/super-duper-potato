# Story pools: English Wikipedia articles a `wikipedia_pool` source draws from, a few a day, so posts can be about
# anything in a place's story, from ancient history to today, not only this week's news.
#
# Each day's batch takes one article from each theme in turn, so a day mixes eras and subjects, and the whole pool
# comes round again after (articles / batch size) days. An article that doesn't exist (renamed, misspelt) is skipped;
# Wikipedia follows redirects. Add titles exactly as they appear in the article's address.

