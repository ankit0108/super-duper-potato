# Fetch every new or changed seed source from GitHub's servers (where the pipeline runs), and resolve the feeds that
# have to be looked up once (YouTube channels, podcasts). Informational: the log lists each source as OK or FAIL;
# it never fails the pull request. The log shows source ids, URLs and counts only.
name: sources-check

on:
  pull_request:
    paths: ["pbs/defaults/sources.yaml", "pbs/scout/check.py", ".github/workflows/sources-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -q -e .
      - name: Check new and changed sources
        run: pbs sources-check --base "origin/${GITHUB_BASE_REF:-main}" --also bsky-trends,lobsters,ainews,social-pulse
