# Build the desk and publish it to GitHub Pages (free for public repos). The desk holds no data: it
# reads and writes the private data repo with a token that stays in the browser.
name: desk

on:
  push:
    branches: [main]
    paths: ["web/**", "pbs/**", ".github/workflows/desk.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -q -e .
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Demo data for "Explore the demo" (synthetic; built offline by the real pipeline)
        run: npm run demo-data
      - run: npm run build
        env:
          VITE_DEFAULT_DATA_REPO: ${{ vars.PBS_DATA_REPO }}
          VITE_DEFAULT_CODE_REPO: ${{ github.repository }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
