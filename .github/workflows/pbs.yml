# The PBS pipeline. Every run is a "tick" that does whatever is due, so a delayed, dropped or cancelled
# scheduled run is recovered by the next run of any kind. The desk triggers this workflow for work
# Ankit is waiting on (answers, rewrites, requests, weekly review).
name: pbs

on:
  schedule:
    # Morning delivery. GitHub often starts scheduled runs hours late (3 h on 28 Sep 2026), so the first tries
    # are early; the first run after 01:00 Melbourne time delivers and the rest do nothing more.
    - cron: "11 15 * * *"      # 01:11 AEST / 02:11 AEDT
    - cron: "41 16 * * *"      # 02:41 AEST / 03:41 AEDT
    - cron: "11 18 * * *"      # catch-up: 04:11 AEST / 05:11 AEDT
    - cron: "47 19 * * *"      # catch-up: 05:47 AEST / 06:47 AEDT
    - cron: "7 1,7,13 * * *"   # light ticks: ingest desk events, expire, learn, catch up
    - cron: "23 9 * * 6"       # Saturday batch: 19:23 AEST / 20:23 AEDT
  workflow_dispatch:
    inputs:
      hint:
        description: "Tasks to run now (comma-separated): morning, weekly_batch, reflection, doctor, scout, platform_research"
        required: false
        default: ""
      force:
        description: "Force hinted tasks (for example another morning set)"
        type: boolean
        default: false

permissions:
  contents: write   # the 'data' branch in single-repo mode
  actions: write    # keep the schedule alive

concurrency:
  group: pbs-state
  cancel-in-progress: false

env:
  PBS_PUBLIC_LOGS: "1"   # logs carry counts and IDs only; personal content stays in the private data repo
  PBS_DATA_DIR: .pbs-data

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          # The data scripts authenticate with PBS_DATA_TOKEN; a persisted workflow token would be sent instead.
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -q -e .

      - name: Check out data
        id: data
        env:
          PBS_DATA_REPO: ${{ vars.PBS_DATA_REPO }}
          PBS_DATA_BRANCH: ${{ vars.PBS_DATA_BRANCH }}
          PBS_DATA_TOKEN: ${{ secrets.PBS_DATA_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: scripts/data-checkout.sh

      - name: Tick
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # AI images (optional): Cloudflare Workers AI is free; Gemini and xAI images are paid per image.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_IMAGE_API_KEY: ${{ secrets.GEMINI_IMAGE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PBS_BLOCKLIST: ${{ secrets.PBS_BLOCKLIST }}
          PBS_NTFY_TOPIC: ${{ secrets.PBS_NTFY_TOPIC }}
          PBS_TELEGRAM_BOT_TOKEN: ${{ secrets.PBS_TELEGRAM_BOT_TOKEN }}
          PBS_TELEGRAM_CHAT_ID: ${{ secrets.PBS_TELEGRAM_CHAT_ID }}
          PBS_DESK_URL: ${{ vars.PBS_DESK_URL }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_HINT: ${{ inputs.hint }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          HINT="$INPUT_HINT"
          if [ "$EVENT" = "schedule" ]; then
            case "$SCHEDULE" in
              "11 15 * * *"|"41 16 * * *"|"11 18 * * *"|"47 19 * * *") HINT="morning" ;;
              "23 9 * * 6") HINT="weekly_batch" ;;
              *) HINT="" ;;
            esac
          fi
          FORCE=""
          if [ "$INPUT_FORCE" = "true" ]; then FORCE="--force"; fi
          pbs tick --trigger "$EVENT" --hint "$HINT" $FORCE

      - name: Check models and sources anyway
        # The data couldn't be checked out (the error above says why). Run the doctor on a throwaway state so
        # this run still reports whether the model keys and sources work.
        if: failure() && steps.data.outcome == 'failure'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_IMAGE_API_KEY: ${{ secrets.GEMINI_IMAGE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PBS_BLOCKLIST: ${{ secrets.PBS_BLOCKLIST }}
        run: pbs doctor --data "$RUNNER_TEMP/pbs-diagnose" || true

      - name: Save data
        if: always()
        env:
          PBS_DATA_REPO: ${{ vars.PBS_DATA_REPO }}
        run: |
          scripts/data-push.sh "pbs: ${{ github.event_name }} tick ${{ github.run_id }}"

      - name: Keep the schedule alive
        if: github.event_name == 'schedule' && github.event.schedule == '23 9 * * 6'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/keepalive.sh
